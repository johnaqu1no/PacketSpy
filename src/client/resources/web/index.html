<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PacketSpy</title>
<style>
/* Sculk: the block that listens for vibrations. Colour only ever means direction. */
:root {
    --bg: #0c1f26;
    --panel: #10272f;
    --raise: #15323b;
    --line: #1f3d47;
    --ink: #d7e7e9;
    --dim: #82a0a7;
    --in: #34d5e2;
    --out: #f2683f;
    --sel: rgba(52, 213, 226, 0.13);
    --focus: #34d5e2;

    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --row-h: 26px;
}
:root[data-theme="light"] {
    --bg: #eef2f1;
    --panel: #ffffff;
    --raise: #e3e9e8;
    --line: #d2dbda;
    --ink: #11252b;
    --dim: #5b7076;
    --in: #08808c;
    --out: #c4441b;
    --sel: rgba(8, 128, 140, 0.11);
    --focus: #08808c;
}
@media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
        --bg: #eef2f1;
        --panel: #ffffff;
        --raise: #e3e9e8;
        --line: #d2dbda;
        --ink: #11252b;
        --dim: #5b7076;
        --in: #08808c;
        --out: #c4441b;
        --sel: rgba(8, 128, 140, 0.11);
        --focus: #08808c;
    }
}
@media (max-width: 760px) {
    :root { --row-h: 34px; }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 var(--sans);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---- Top bar ---- */
.bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.word { font: 700 16px var(--mono); letter-spacing: -0.02em; }
.status { color: var(--dim); font-size: 13px; white-space: nowrap; }
.dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--dim);
    align-self: center;
    flex: none;
}
.dot.live { background: var(--in); box-shadow: 0 0 0 3px var(--sel); }
.dot.paused { background: #d9a43a; }
.dot.down { background: var(--out); }

.search { flex: 1; display: flex; min-width: 0; max-width: 460px; margin-left: auto; }
.search input {
    flex: 1; min-width: 0;
    height: 32px; padding: 0 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 6px 0 0 6px;
}
.search input::placeholder { color: var(--dim); }
.search .toggle { border-radius: 0 6px 6px 0; font-family: var(--mono); }

.btn, .toggle {
    height: 32px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
}
.btn:hover, .toggle:hover { background: var(--raise); }
.toggle[aria-pressed="false"] { color: var(--dim); }
.toggle[aria-pressed="true"] { background: var(--raise); }
.toggle.in[aria-pressed="true"] { color: var(--in); border-color: var(--in); }
.toggle.out[aria-pressed="true"] { color: var(--out); border-color: var(--out); }
#regex[aria-pressed="true"] { color: var(--in); }
#pause[aria-pressed="true"] { color: #d9a43a; border-color: #d9a43a; }
.group { display: flex; gap: 6px; }
.icon { width: 32px; padding: 0; display: grid; place-items: center; }
.icon svg { width: 16px; height: 16px; }

/* ---- Traffic waveform: the one loud thing ---- */
.pulse {
    position: relative;
    height: 56px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}
#wave { display: block; width: 100%; height: 100%; }
.rates {
    position: absolute; right: 16px; top: 50%;
    transform: translateY(-50%);
    display: grid; gap: 2px;
    text-align: right;
    font: 600 13px/1.1 var(--mono);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
}
.rates .in { color: var(--in); }
.rates .out { color: var(--out); }
.rates small { color: var(--dim); font-weight: 400; font-family: var(--sans); }

/* ---- Categories & sort ---- */
.filters {
    display: flex; align-items: center; gap: 12px;
    padding-right: 16px;
    border-bottom: 1px solid var(--line);
}
.cats {
    flex: 1; min-width: 0;
    display: flex; gap: 4px;
    padding: 8px 16px;
    overflow-x: auto;
    scrollbar-width: none;
}
.sort { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; flex: none; }
.sort select {
    height: 28px; padding: 0 8px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    cursor: pointer;
}
.cats::-webkit-scrollbar { display: none; }
.cats button {
    height: 28px; padding: 0 12px;
    background: none; border: 0; border-radius: 14px;
    color: var(--dim);
    cursor: pointer;
    white-space: nowrap;
}
.cats button:hover { color: var(--ink); }
.cats button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }

/* ---- Packet list (virtual: only visible rows exist) ---- */
.main { flex: 1; display: flex; min-height: 0; }
.list-wrap { position: relative; flex: 1; min-width: 0; }
.list { position: absolute; inset: 0; overflow-y: auto; contain: strict; }
#spacer { width: 1px; }
#rows { position: absolute; top: 0; left: 0; right: 0; will-change: transform; }
.row {
    display: grid;
    grid-template-columns: 96px 34px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    height: var(--row-h);
    padding: 0 16px;
    font: 13px var(--mono);
    border-left: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
}
.row:hover { background: var(--raise); }
.row.sel { background: var(--sel); }
.row.in { border-left-color: var(--in); }
.row.out { border-left-color: var(--out); }
.row .t { color: var(--dim); font-variant-numeric: tabular-nums; }
.row .d { font-size: 12px; }
.row.in .d { color: var(--in); }
.row.out .d { color: var(--out); }
.row .n { overflow: hidden; text-overflow: ellipsis; }
.row .n i { font-style: normal; color: var(--dim); margin-left: 10px; }
.row .x { color: var(--dim); font-variant-numeric: tabular-nums; }
/* name / most common order: packet type rows and the packets under an opened type */
.row.type { font-weight: 600; }
.row.type .n::before { content: "\25B8"; display: inline-block; width: 16px; color: var(--dim); font-weight: 400; }
.row.type.open .n::before { content: "\25BE"; }
.row.type .x { color: var(--ink); }
.row.type + .row.type { box-shadow: inset 0 1px 0 var(--line); }
.row.child .n { padding-left: 16px; }
.row.child { background: color-mix(in srgb, var(--raise) 45%, transparent); }
.row.child:hover { background: var(--raise); }
.row.child.sel { background: var(--sel); }

.empty {
    position: absolute; inset: 0;
    display: grid; place-content: center;
    padding: 24px;
    text-align: center;
    color: var(--dim);
    pointer-events: none;
}
.empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.latest {
    position: absolute; bottom: 14px; left: 50%;
    transform: translateX(-50%);
    height: 32px; padding: 0 14px;
    background: var(--ink); color: var(--bg);
    border: 0; border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
}

/* ---- Details ---- */
.details {
    width: min(460px, 42vw);
    display: flex; flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    min-height: 0;
}
.details header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.details h2 { margin: 0 0 4px; font: 600 16px var(--mono); word-break: break-all; }
.details .meta { margin: 0; color: var(--dim); font-size: 13px; }
.details .meta .in { color: var(--in); }
.details .meta .out { color: var(--out); }
.details .cls { margin: 6px 0 0; font: 12px var(--mono); color: var(--dim); word-break: break-all; }
.details .tools { display: flex; gap: 6px; margin-top: 12px; }
.details .tools .icon { margin-left: auto; }
.json {
    flex: 1; margin: 0; padding: 14px 16px;
    overflow: auto;
    font: 12.5px/1.55 var(--mono);
    white-space: pre-wrap; word-break: break-word;
}
.j-key { color: var(--ink); }
.j-str { color: var(--in); }
.j-num { color: var(--out); }
.j-lit { color: var(--dim); font-style: italic; }
.json { color: var(--dim); }

/* ---- Footer ---- */
.foot {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 6px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    font-size: 12px;
}
.foot span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- Settings ---- */
.settings {
    position: fixed; top: 58px; right: 16px; z-index: 20;
    width: 320px; max-height: calc(100vh - 80px);
    overflow-y: auto;
    padding: 6px 16px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
}
.settings h3 { margin: 14px 0 8px; font-size: 13px; font-weight: 600; color: var(--dim); }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; cursor: pointer; }
.switch small { display: block; color: var(--dim); font-size: 12px; }
.switch input { width: 18px; height: 18px; accent-color: var(--in); flex: none; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; height: 30px; background: none; border: 0; cursor: pointer; color: var(--dim); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
.mute-add { display: flex; gap: 6px; }
.mute-add input {
    flex: 1; min-width: 0; height: 32px; padding: 0 10px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font-family: var(--mono); font-size: 13px;
}
.muted { list-style: none; margin: 8px 0 0; padding: 0; }
.muted li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font: 13px var(--mono); }
.muted li span { overflow: hidden; text-overflow: ellipsis; }
.muted button { height: 26px; padding: 0 8px; font-family: var(--sans); font-size: 12px; }
.muted .none { color: var(--dim); font: 13px var(--sans); }

/* ---- Phones ---- */
@media (max-width: 760px) {
    .bar { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    .status { display: none; }
    .actions { margin-left: auto; gap: 4px; }
    .actions .btn { padding: 0 9px; }
    .actions .icon { padding: 0; }
    /* second row: search + direction */
    .search { order: 3; flex: 1 1 200px; max-width: none; margin-left: 0; }
    .dirs { order: 4; }
    .search input, .search .toggle, .dirs .toggle { height: 36px; }
    .pulse { height: 44px; }
    .cats { padding: 6px 12px; }
    .filters { padding-right: 12px; gap: 6px; }
    .sort span { display: none; }
    .sort select { padding: 0 4px; font-size: 13px; }
    .row { grid-template-columns: 0 30px minmax(0, 1fr) auto; gap: 8px; padding: 0 12px; font-size: 14px; }
    .row .t { visibility: hidden; }
    .row .n i { display: none; }
    .details {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
        width: auto; height: 70vh;
        border-left: 0; border-top: 1px solid var(--line);
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
    }
    .settings { left: 12px; right: 12px; width: auto; }
}
@media (prefers-reduced-motion: no-preference) {
    .details, .settings { animation: rise 140ms ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
}
</style>
</head>
<body>
<header class="bar">
    <div class="brand">
        <span class="dot" id="dot"></span>
        <span class="word">PacketSpy</span>
        <span class="status" id="status">Connecting…</span>
    </div>
    <div class="search">
        <input id="q" type="search" placeholder="Search name or class" title="Shortcut: /" aria-label="Search packets by name or class" autocomplete="off" spellcheck="false">
        <button id="regex" class="toggle" aria-pressed="false" title="Search with a regular expression">.*</button>
    </div>
    <div class="group dirs" role="group" aria-label="Direction">
        <button class="toggle in" id="f-in" aria-pressed="true" title="Packets from the server">In</button>
        <button class="toggle out" id="f-out" aria-pressed="true" title="Packets you send">Out</button>
    </div>
    <div class="group actions">
        <button id="pause" class="btn" aria-pressed="false">Pause</button>
        <button id="clear" class="btn">Clear</button>
        <button id="export" class="btn">Export</button>
        <button id="settings-btn" class="btn icon" aria-expanded="false" aria-controls="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h7M12 4h2M2 12h2M7 12h7"/><circle cx="10.5" cy="4" r="1.5"/><circle cx="5.5" cy="12" r="1.5"/></svg>
        </button>
    </div>
</header>

<section class="pulse" aria-label="Packets per second over the last minute">
    <canvas id="wave"></canvas>
    <div class="rates" aria-live="off">
        <span class="in"><span id="rate-in">0</span> <small>in/s</small></span>
        <span class="out"><span id="rate-out">0</span> <small>out/s</small></span>
    </div>
</section>

<div class="filters">
    <nav class="cats" id="cats" aria-label="Category"></nav>
    <label class="sort">
        <span>Sort</span>
        <select id="sort" aria-label="Sort packets">
            <option value="bottom">Newest at bottom</option>
            <option value="top">Newest at top</option>
            <option value="name">Type, A–Z</option>
            <option value="common">Type, most common</option>
        </select>
    </label>
</div>

<main class="main">
    <div class="list-wrap">
        <div id="list" class="list" tabindex="0" aria-label="Packets, use arrow keys to move">
            <div id="spacer"></div>
            <div id="rows"></div>
        </div>
        <div id="empty" class="empty"></div>
        <button id="latest" class="latest" hidden>Jump to latest</button>
    </div>
    <aside id="details" class="details" hidden aria-label="Packet details">
        <header>
            <h2 id="d-name"></h2>
            <p class="meta" id="d-meta"></p>
            <p class="cls" id="d-class"></p>
            <div class="tools">
                <button class="btn" id="d-copy">Copy JSON</button>
                <button class="btn" id="d-mute">Mute this packet</button>
                <button class="btn icon" id="d-close" title="Close" aria-label="Close details">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                </button>
            </div>
        </header>
        <pre class="json" id="d-json"></pre>
    </aside>
</main>

<footer class="foot">
    <span id="count">No packets yet</span>
    <span id="note"></span>
</footer>

<div id="settings" class="settings" hidden role="dialog" aria-label="Settings">
    <h3>Capture</h3>
    <label class="switch">
        <span>Player movement<small>Your position and look packets, sent many times a second</small></span>
        <input type="checkbox" id="s-move" checked>
    </label>
    <label class="switch">
        <span>Deep inspection<small>Show nested data in full, like bundles and entity metadata. Much more data on busy servers</small></span>
        <input type="checkbox" id="s-deep">
    </label>
    <label class="switch">
        <span>Group repeats<small>Merge identical packets in a row into one line</small></span>
        <input type="checkbox" id="s-stack" checked>
    </label>
    <h3>Theme</h3>
    <div class="seg" id="s-theme">
        <button data-theme="system" aria-pressed="true">System</button>
        <button data-theme="dark" aria-pressed="false">Dark</button>
        <button data-theme="light" aria-pressed="false">Light</button>
    </div>
    <h3>Muted packets</h3>
    <form class="mute-add" id="mute-form">
        <input id="mute-input" placeholder="Packet name, e.g. keep_alive" aria-label="Packet name to mute" autocomplete="off" spellcheck="false">
        <button class="btn" type="submit">Mute</button>
    </form>
    <ul class="muted" id="muted"></ul>
</div>

<script>
'use strict';
// The mod fills in the real port when it serves this page (webSocketPort in packetspy.json)
const WS_PORT = parseInt('__PACKETSPY_WS_PORT__', 10) || 8887;
const MAX_PACKETS = 5000;
const CATEGORIES = [
    ['all', 'All'], ['player', 'Player'], ['entity', 'Entities'], ['world', 'World'],
    ['inventory', 'Inventory'], ['chat', 'Chat'], ['connection', 'Connection'], ['other', 'Other'],
];
// First match wins; based on the packet id (e.g. "move_player_pos"), which is the same on every version
const CATEGORY_RULES = [
    ['chat', /chat|command|title|action_bar|tab_list/],
    ['inventory', /container|slot|recipe|merchant|cooldown|carried|creative|book|sign|anvil|beacon|enchant|trade|screen|cursor|inventory/],
    ['entity', /entit|mob|spawn|passenger|leash|take_item|animate|hurt|damage|rotate_head|projectile|vehicle|minecart|boat|equipment/],
    ['player', /player|move|interact|attack|use_item|swing|pick|abilities|respawn|health|experience|camera|look_at|teleport|client_command|input/],
    ['connection', /intention|hello|login|keep_alive|ping|pong|custom|cookie|transfer|disconnect|configuration|known_packs|registry|tags|features|resource_pack|information|server_links|bundle|status|client_tick|code_of_conduct|dialog|key/],
    ['world', /chunk|block|level|light|world|particle|sound|explode|time|weather|game_event|border|biome|section|map|forget|structure|jigsaw|tick/],
];

const $ = (id) => document.getElementById(id);
const els = {
    dot: $('dot'), status: $('status'), q: $('q'), regex: $('regex'), fIn: $('f-in'), fOut: $('f-out'),
    pause: $('pause'), clear: $('clear'), export: $('export'), settingsBtn: $('settings-btn'), settings: $('settings'),
    wave: $('wave'), rateIn: $('rate-in'), rateOut: $('rate-out'), cats: $('cats'), sort: $('sort'),
    list: $('list'), spacer: $('spacer'), rows: $('rows'), empty: $('empty'), latest: $('latest'),
    details: $('details'), dName: $('d-name'), dMeta: $('d-meta'), dClass: $('d-class'), dJson: $('d-json'),
    dCopy: $('d-copy'), dMute: $('d-mute'), dClose: $('d-close'),
    count: $('count'), note: $('note'),
    sMove: $('s-move'), sDeep: $('s-deep'), sStack: $('s-stack'), sTheme: $('s-theme'), muteForm: $('mute-form'), muteInput: $('mute-input'), muted: $('muted'),
};

const state = {
    packets: [],          // everything kept, oldest first
    view: [],             // packets passing the filters
    seq: 0,
    connected: false,
    paused: false,
    stack: true,
    movement: true,
    deep: false,
    muted: [],
    filter: { text: '', regex: null, cat: 'all', in: true, out: true },
    selected: null,
    sort: 'bottom',       // bottom | top (live, by time), name | common (re-sorted once a second)
    sorted: null,         // rows in name/common order: packet types, plus the packets of opened types
    groups: null,         // packet types in name/common order
    expanded: new Set(),  // opened packet types ("in:set_entity_data")
    follow: true,         // stick to the newest packet (bottom or top edge)
    unseen: 0,
    added: 0,             // packets added to the view in the current batch
    lastKey: null,        // JSON of the newest packet's data, only computed when needed for grouping
};
const isLive = () => state.sort === 'bottom' || state.sort === 'top';

// ---------------------------------------------------------------- storage
function load(key, fallback) {
    try { const v = localStorage.getItem('packetspy.' + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function save(key, value) {
    try { localStorage.setItem('packetspy.' + key, JSON.stringify(value)); } catch { /* private mode */ }
}

// ---------------------------------------------------------------- connection
let ws;
function connect() {
    ws = new WebSocket(`ws://${location.hostname || '127.0.0.1'}:${WS_PORT}`);
    ws.onopen = () => { state.connected = true; updateStatus(); note(''); };
    ws.onclose = () => {
        state.connected = false;
        updateStatus();
        setTimeout(connect, 3000);
    };
    ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch { return; }
        for (const message of Array.isArray(data) ? data : [data]) handle(message);
        afterBatch();
    };
}

function send(message) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(message));
        return true;
    }
    note('Not connected to Minecraft, the change was not saved');
    return false;
}

function handle(m) {
    if (m.type === 'config') {
        state.movement = !!m.logPlayerMovementPackets;
        state.deep = !!m.deepInspection;
        els.sDeep.checked = state.deep;
        state.muted = Array.isArray(m.silencedPackets) ? m.silencedPackets : [];
        els.sMove.checked = state.movement;
        renderMuted();
        rebuildView();
    } else if (m.type === 'dropped') {
        note(`Skipped ${m.count.toLocaleString()} packets that arrived faster than PacketSpy could send them`);
    } else if (m.type === 'packet') {
        wave.add(m.direction);
        if (!state.paused) addPacket(m);
    } else if (m.error) {
        note(m.error);
    }
}

// ---------------------------------------------------------------- packets
function categorize(name) {
    const n = name.toLowerCase();
    for (const [cat, re] of CATEGORY_RULES) if (re.test(n)) return cat;
    return 'other';
}

function addPacket(m) {
    const last = state.packets[state.packets.length - 1];
    if (state.stack && last && last.dir === m.direction && last.name === m.name) {
        const key = JSON.stringify(m.data);
        if (state.lastKey === null) state.lastKey = JSON.stringify(last.data);
        if (key === state.lastKey) {
            last.count++;
            last.time = m.time || Date.now();
            dirty = true;
            return;
        }
        state.lastKey = key;
    } else {
        state.lastKey = null;
    }

    const cls = m.class || '';
    const simple = cls.slice(Math.max(cls.lastIndexOf('.'), cls.lastIndexOf('$')) + 1);
    const p = {
        seq: ++state.seq,
        dir: m.direction === 'IN' ? 'in' : 'out',
        name: m.name,
        cls, simple,
        time: m.time || Date.now(),
        data: m.data,
        count: 1,
        cat: categorize(m.name),
        hay: (m.name + ' ' + cls).toLowerCase(),
    };
    state.packets.push(p);
    if (matches(p)) {
        state.view.push(p);
        state.added++;
        if (!state.follow && isLive()) state.unseen++;
    }
    dirty = true;
}

function afterBatch() {
    const extra = state.packets.length - MAX_PACKETS;
    let cut = 0;
    if (extra > 0) {
        state.packets.splice(0, extra);
        const oldest = state.packets[0].seq;
        while (cut < state.view.length && state.view[cut].seq < oldest) cut++;
        if (cut) state.view.splice(0, cut);
    }
    // Keep the rows you are looking at in place while the list grows or old packets drop off
    if (!state.follow) {
        if (state.sort === 'bottom' && cut) els.list.scrollTop = Math.max(0, els.list.scrollTop - cut * rowH);
        if (state.sort === 'top' && state.added) els.list.scrollTop += state.added * rowH;
    }
    state.added = 0;
    if (!isLive()) requestResort(false);
    schedule();
}

// ---------------------------------------------------------------- sorting
let sortTimer = 0;
const byName = (a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);

// Name / most common order: one row per packet type; click a type to list its packets (newest first)
function resort() {
    clearTimeout(sortTimer);
    sortTimer = 0;
    state.sorted = null;
    state.groups = null;
    if (!isLive()) {
        const groups = new Map();
        for (const p of state.view) {
            const key = p.dir + ':' + p.name;
            let g = groups.get(key);
            if (!g) groups.set(key, g = { group: true, key, dir: p.dir, name: p.name, simple: p.simple, total: 0, time: 0, items: [] });
            g.items.push(p);
            g.total += p.count;
            g.time = p.time;
        }
        state.groups = [...groups.values()].sort(state.sort === 'name'
            ? (a, b) => byName(a, b) || a.dir.localeCompare(b.dir)
            : (a, b) => b.total - a.total || byName(a, b));
        const rows = [];
        for (const g of state.groups) {
            rows.push(g);
            if (state.expanded.has(g.key)) {
                for (let i = g.items.length - 1; i >= 0; i--) rows.push(g.items[i]);
            }
        }
        state.sorted = rows;
    }
    dirty = true;
    schedule();
}

function toggleGroup(g) {
    if (state.expanded.has(g.key)) state.expanded.delete(g.key);
    else state.expanded.add(g.key);
    resort();
}

// Type orders are rebuilt at most once a second, and not while the mouse is over the list,
// so rows never move away from under the pointer
let pointerInList = false;
function requestResort(now) {
    if (now) resort();
    else if (!sortTimer) sortTimer = setTimeout(() => {
        sortTimer = 0;
        if (pointerInList) requestResort(false);
        else resort();
    }, 1000);
}
els.list.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') pointerInList = true; });
els.list.addEventListener('pointerleave', () => { pointerInList = false; });

function shownCount() {
    return isLive() ? state.view.length : (state.sorted ? state.sorted.length : 0);
}

function rowAt(i) {
    if (state.sort === 'top') return state.view[state.view.length - 1 - i];
    if (!isLive()) return state.sorted ? state.sorted[i] : undefined;
    return state.view[i];
}

function indexOfShown(p) {
    if (state.sort === 'top') {
        const i = state.view.indexOf(p);
        return i < 0 ? -1 : state.view.length - 1 - i;
    }
    return (isLive() ? state.view : state.sorted || []).indexOf(p);
}

function setSort(sort) {
    state.sort = sort;
    els.sort.value = sort;
    save('sort', sort);
    state.follow = isLive();
    state.unseen = 0;
    if (sort !== 'bottom') els.list.scrollTop = 0;
    requestResort(true);
}

function matches(p) {
    const f = state.filter;
    if (p.dir === 'in' ? !f.in : !f.out) return false;
    if (f.cat !== 'all' && p.cat !== f.cat) return false;
    if (state.muted.includes(p.name)) return false;
    if (f.regex) return f.regex.test(p.hay);
    return !f.text || p.hay.includes(f.text);
}

function rebuildView() {
    state.view = state.packets.filter(matches);
    state.unseen = 0;
    state.follow = isLive();
    // Jump to the top right away: a scroll event from the list shrinking would otherwise
    // look like the user scrolled away from the newest packets
    if (state.sort !== 'bottom') els.list.scrollTop = 0;
    requestResort(true);
}

// ---------------------------------------------------------------- virtual list
let rowH = 26;
let dirty = true;
let frame = 0;
const pool = [];

function measure() {
    rowH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row-h')) || 26;
}

function schedule() {
    if (!frame) frame = requestAnimationFrame(render);
}

function makeRow() {
    const row = document.createElement('div');
    row.className = 'row';
    for (const c of ['t', 'd', 'n', 'x']) {
        const span = document.createElement('span');
        span.className = c;
        row.appendChild(span);
    }
    row.children[2].appendChild(document.createTextNode(''));
    row.children[2].appendChild(document.createElement('i'));
    els.rows.appendChild(row);
    return row;
}

function render() {
    frame = 0;
    const list = els.list;
    const total = shownCount();
    els.spacer.style.height = total * rowH + 'px';
    if (state.follow) list.scrollTop = state.sort === 'top' ? 0 : list.scrollHeight;

    const first = Math.max(0, Math.floor(list.scrollTop / rowH) - 4);
    const last = Math.min(total, Math.ceil((list.scrollTop + list.clientHeight) / rowH) + 4);
    els.rows.style.transform = `translateY(${first * rowH}px)`;

    const needed = last - first;
    while (pool.length < needed) pool.push(makeRow());
    for (let i = 0; i < pool.length; i++) {
        const row = pool[i];
        const p = i < needed ? rowAt(first + i) : undefined;
        if (!p) { row.hidden = true; continue; }
        row.hidden = false;
        const sel = p === state.selected;
        if (row._p !== p || row._count !== p.count || row._sel !== sel) {
            row._p = p;
            row._count = p.count;
            row._sel = sel;
            if (p.group) {
                const open = state.expanded.has(p.key);
                row.className = 'row type ' + p.dir + (open ? ' open' : '');
                row.setAttribute('aria-expanded', String(open));
                row.children[3].textContent = p.total.toLocaleString();
            } else {
                row.className = 'row ' + p.dir + (sel ? ' sel' : '') + (isLive() ? '' : ' child');
                row.removeAttribute('aria-expanded');
                row.children[3].textContent = p.count > 1 ? '×' + p.count.toLocaleString() : '';
            }
            row.children[0].textContent = clock(p.time);
            row.children[1].textContent = p.dir;
            const name = row.children[2];
            name.firstChild.nodeValue = p.name;
            name.lastChild.textContent = p.simple !== p.name ? p.simple : '';
        }
    }

    els.latest.hidden = !isLive() || state.follow || state.unseen === 0;
    els.latest.textContent = `Jump to latest (${state.unseen.toLocaleString()} new)`;
    updateEmpty();
    if (dirty) updateCount();
    dirty = false;
}

els.list.addEventListener('scroll', () => {
    const list = els.list;
    const atNewest = state.sort === 'bottom' ? list.scrollTop + list.clientHeight >= list.scrollHeight - rowH
        : state.sort === 'top' ? list.scrollTop <= rowH
        : false;
    if (atNewest) state.unseen = 0;
    state.follow = atNewest;
    schedule();
}, { passive: true });

els.rows.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row || !row._p) return;
    if (row._p.group) toggleGroup(row._p);
    else select(row._p);
});

els.list.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const step = e.key === 'ArrowDown' ? 1 : -1;
    const i = indexOfShown(state.selected);
    let target = i < 0 ? (state.sort === 'bottom' ? shownCount() - 1 : 0) : i + step;
    while (rowAt(target) && rowAt(target).group) target += i < 0 ? 1 : step;   // packet types aren't selectable
    const next = rowAt(target);
    if (!next) return;
    select(next);
    const top = target * rowH;
    if (top < els.list.scrollTop) els.list.scrollTop = top;
    else if (top + rowH > els.list.scrollTop + els.list.clientHeight) els.list.scrollTop = top + rowH - els.list.clientHeight;
});

els.latest.addEventListener('click', () => {
    state.follow = true;
    state.unseen = 0;
    schedule();
});

function updateEmpty() {
    let title = '', body = '';
    if (!state.connected) {
        title = "Can't reach Minecraft";
        body = 'Start the game with PacketSpy installed. This page reconnects by itself.';
    } else if (state.packets.length === 0) {
        title = state.paused ? 'Paused' : 'Waiting for packets';
        body = state.paused ? 'Press Resume to start capturing again.' : 'Join a world or a server and its traffic shows up here.';
    } else if (state.view.length === 0) {
        title = 'No packets match';
        body = 'Change the search, direction or category to see more.';
    }
    els.empty.hidden = !title;
    if (title) {
        els.empty.textContent = '';
        const strong = document.createElement('strong');
        strong.textContent = title;
        els.empty.append(strong, body);
    }
}

function updateCount() {
    const kept = state.packets.length;
    const types = state.groups ? `${state.groups.length.toLocaleString()} packet types, ` : '';
    els.count.textContent = kept === 0
        ? 'No packets yet'
        : state.view.length === kept
            ? `${types}${kept.toLocaleString()} packets`
            : `${types}${state.view.length.toLocaleString()} of ${kept.toLocaleString()} packets`;
}

// ---------------------------------------------------------------- details
function select(p) {
    state.selected = p;
    els.details.hidden = false;
    els.dName.textContent = p.name;
    els.dMeta.textContent = '';
    const dir = document.createElement('span');
    dir.className = p.dir;
    dir.textContent = p.dir === 'in' ? 'From the server' : 'Sent to the server';
    els.dMeta.append(dir, `, ${clock(p.time)}` + (p.count > 1 ? `, seen ${p.count.toLocaleString()} times in a row` : ''));
    els.dClass.textContent = p.cls;
    renderJson(els.dJson, p.data);
    schedule();
}

function closeDetails() {
    state.selected = null;
    els.details.hidden = true;
    els.dJson.textContent = '';   // drop the DOM for big packets
    schedule();
}
els.dClose.addEventListener('click', closeDetails);

// JSON with colours, built from text nodes so packet data can never become HTML
function renderJson(pre, value) {
    const text = JSON.stringify(value, null, 2) ?? 'null';
    const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text))) {
        if (m.index > last) frag.append(text.slice(last, m.index));
        const span = document.createElement('span');
        span.className = m[1] ? (m[2] ? 'j-key' : 'j-str') : /\d/.test(m[0][m[0].length - 1]) ? 'j-num' : 'j-lit';
        span.textContent = m[1] || m[0];
        frag.append(span);
        if (m[2]) frag.append(m[2]);
        last = re.lastIndex;
    }
    frag.append(text.slice(last));
    pre.textContent = '';
    pre.append(frag);
    pre.scrollTop = 0;
}

els.dCopy.addEventListener('click', async () => {
    if (!state.selected) return;
    const text = JSON.stringify(state.selected.data, null, 2);
    try {
        await navigator.clipboard.writeText(text);
    } catch {
        // Clipboard API needs a secure page; a phone on http://<lan ip> isn't one
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
    }
    els.dCopy.textContent = 'Copied';
    setTimeout(() => { els.dCopy.textContent = 'Copy JSON'; }, 1200);
});

els.dMute.addEventListener('click', () => {
    if (state.selected && send({ action: 'silencePacket', packetName: state.selected.name })) {
        note(`Muted ${state.selected.name}`);
        closeDetails();
    }
});

// ---------------------------------------------------------------- filters & actions
function setPressed(button, on) { button.setAttribute('aria-pressed', String(on)); }

function buildCategories() {
    for (const [id, label] of CATEGORIES) {
        const b = document.createElement('button');
        b.textContent = label;
        b.dataset.cat = id;
        setPressed(b, id === state.filter.cat);
        els.cats.appendChild(b);
    }
}
els.cats.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.filter.cat = b.dataset.cat;
    for (const other of els.cats.children) setPressed(other, other === b);
    save('cat', state.filter.cat);
    rebuildView();
});

els.sort.addEventListener('change', () => setSort(els.sort.value));

let searchTimer = 0;
function applySearch() {
    const raw = els.q.value.trim();
    state.filter.text = raw.toLowerCase();
    state.filter.regex = null;
    els.q.setCustomValidity('');
    if (raw && els.regex.getAttribute('aria-pressed') === 'true') {
        try { state.filter.regex = new RegExp(raw, 'i'); }
        catch { els.q.setCustomValidity('Not a valid regular expression'); note('Not a valid regular expression'); return; }
    }
    rebuildView();
}
els.q.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(applySearch, 150); });
els.regex.addEventListener('click', () => {
    setPressed(els.regex, els.regex.getAttribute('aria-pressed') !== 'true');
    applySearch();
});

for (const [button, key] of [[els.fIn, 'in'], [els.fOut, 'out']]) {
    button.addEventListener('click', () => {
        state.filter[key] = !state.filter[key];
        setPressed(button, state.filter[key]);
        rebuildView();
    });
}

els.pause.addEventListener('click', () => {
    state.paused = !state.paused;
    setPressed(els.pause, state.paused);
    els.pause.textContent = state.paused ? 'Resume' : 'Pause';
    updateStatus();
    schedule();
});

els.clear.addEventListener('click', () => {
    state.packets = [];
    state.view = [];
    state.lastKey = null;
    state.unseen = 0;
    state.follow = isLive();
    closeDetails();
    note('');
    requestResort(true);
});

els.export.addEventListener('click', () => {
    // Same order as on screen; in name / most common order every packet of every type is included
    const packets = state.sort === 'top' ? state.view.slice().reverse()
        : state.groups ? state.groups.flatMap((g) => g.items)
        : state.view;
    const total = packets.length;
    if (total === 0) { note('Nothing to export, no packets match the filters'); return; }
    const lines = [`PacketSpy export, ${new Date().toLocaleString()}`, ''];
    for (const p of packets) {
        lines.push(`${clock(p.time)}  ${p.dir.padEnd(3)}  ${p.name}${p.count > 1 ? '  x' + p.count : ''}  (${p.cls})`);
        lines.push(JSON.stringify(p.data, null, 2), '');
    }
    const url = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/plain' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `packetspy-${Date.now()}.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    note(`Exported ${total.toLocaleString()} packets`);
});

function updateStatus() {
    els.dot.className = 'dot ' + (!state.connected ? 'down' : state.paused ? 'paused' : 'live');
    els.status.textContent = !state.connected ? 'Reconnecting…' : state.paused ? 'Paused' : 'Live';
    schedule();
}

let noteTimer = 0;
function note(text) {
    els.note.textContent = text;
    clearTimeout(noteTimer);
    if (text) noteTimer = setTimeout(() => { els.note.textContent = ''; }, 8000);
}

// ---------------------------------------------------------------- settings
function toggleSettings(open) {
    els.settings.style.top = els.settingsBtn.closest('.bar').getBoundingClientRect().bottom + 6 + 'px';
    els.settings.hidden = !open;
    els.settingsBtn.setAttribute('aria-expanded', String(open));
}
els.settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSettings(els.settings.hidden); });
document.addEventListener('click', (e) => {
    if (!els.settings.hidden && !els.settings.contains(e.target)) toggleSettings(false);
});

els.sMove.addEventListener('change', () => {
    if (!send({ action: 'toggleMovement', value: els.sMove.checked })) els.sMove.checked = state.movement;
});
els.sDeep.addEventListener('change', () => {
    if (!send({ action: 'toggleDeepInspection', value: els.sDeep.checked })) els.sDeep.checked = state.deep;
});
els.sStack.addEventListener('change', () => {
    state.stack = els.sStack.checked;
    state.lastKey = null;
    save('stack', state.stack);
});

function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    for (const b of els.sTheme.children) setPressed(b, b.dataset.theme === theme);
    save('theme', theme);
    wave.readColors();
}
els.sTheme.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) applyTheme(b.dataset.theme);
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => wave.readColors());

els.muteForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = els.muteInput.value.trim();
    if (name && send({ action: 'silencePacket', packetName: name })) els.muteInput.value = '';
});

function renderMuted() {
    els.muted.textContent = '';
    if (state.muted.length === 0) {
        const li = document.createElement('li');
        li.className = 'none';
        li.textContent = 'Nothing muted. Open a packet and choose Mute.';
        els.muted.appendChild(li);
        return;
    }
    for (const name of state.muted) {
        const li = document.createElement('li');
        const label = document.createElement('span');
        label.textContent = name;
        const button = document.createElement('button');
        button.className = 'btn';
        button.textContent = 'Unmute';
        button.addEventListener('click', () => send({ action: 'unsilencePacket', packetName: name }));
        li.append(label, button);
        els.muted.appendChild(li);
    }
}

// ---------------------------------------------------------------- traffic waveform
const wave = (() => {
    const BUCKET_MS = 500, BUCKETS = 120;            // one minute of history
    const ins = new Uint32Array(BUCKETS), outs = new Uint32Array(BUCKETS);
    let head = Math.floor(Date.now() / BUCKET_MS);
    let colors = {};
    const ctx = els.wave.getContext('2d');

    function roll() {
        const now = Math.floor(Date.now() / BUCKET_MS);
        for (let b = head + 1; b <= Math.min(now, head + BUCKETS); b++) {
            ins[b % BUCKETS] = 0;
            outs[b % BUCKETS] = 0;
        }
        head = now;
    }

    function add(direction) {
        roll();
        (direction === 'IN' ? ins : outs)[head % BUCKETS]++;
    }

    function readColors() {
        const s = getComputedStyle(document.documentElement);
        colors = { in: s.getPropertyValue('--in').trim(), out: s.getPropertyValue('--out').trim(), line: s.getPropertyValue('--line').trim() };
    }

    function draw() {
        roll();
        const canvas = els.wave;
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        let peak = 4;
        for (let i = 0; i < BUCKETS; i++) peak = Math.max(peak, ins[i], outs[i]);
        const mid = Math.round(h / 2) + 0.5;
        const half = h / 2 - 5;
        const step = (w - 150) / BUCKETS;        // leave room for the numbers on the right
        const bar = Math.max(1, step - 1.5);

        ctx.fillStyle = colors.line;
        ctx.fillRect(0, mid - 0.5, w, 1);
        for (let k = 0; k < BUCKETS; k++) {
            const b = (head - BUCKETS + 1 + k) % BUCKETS;
            const x = 16 + k * step;
            // square root keeps quiet moments visible next to chunk-loading bursts
            const up = Math.sqrt(ins[(b + BUCKETS) % BUCKETS] / peak) * half;
            const down = Math.sqrt(outs[(b + BUCKETS) % BUCKETS] / peak) * half;
            if (up > 0) { ctx.fillStyle = colors.in; ctx.fillRect(x, mid - 1 - up, bar, up); }
            if (down > 0) { ctx.fillStyle = colors.out; ctx.fillRect(x, mid + 1, bar, down); }
        }

        // packets per second, from the last two full seconds
        let rin = 0, rout = 0;
        for (let k = 1; k <= 4; k++) {
            rin += ins[(head - k + BUCKETS) % BUCKETS];
            rout += outs[(head - k + BUCKETS) % BUCKETS];
        }
        els.rateIn.textContent = Math.round(rin / 2).toLocaleString();
        els.rateOut.textContent = Math.round(rout / 2).toLocaleString();
    }

    return { add, draw, readColors };
})();

setInterval(() => { if (!document.hidden) wave.draw(); }, 250);

// ---------------------------------------------------------------- keyboard & start
document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== els.q && !(e.target instanceof HTMLInputElement)) {
        e.preventDefault();
        els.q.focus();
    } else if (e.key === 'Escape') {
        if (!els.settings.hidden) toggleSettings(false);
        else if (!els.details.hidden) closeDetails();
    }
});

function clock(ms) {
    const d = new Date(ms);
    return d.toLocaleTimeString('en-GB', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

window.addEventListener('resize', () => { measure(); schedule(); });

state.stack = load('stack', true);
els.sStack.checked = state.stack;
state.filter.cat = load('cat', 'all');
if (!CATEGORIES.some(([id]) => id === state.filter.cat)) state.filter.cat = 'all';
buildCategories();
state.sort = load('sort', 'bottom');
if (![...els.sort.options].some((o) => o.value === state.sort)) state.sort = 'bottom';
els.sort.value = state.sort;
state.follow = isLive();
renderMuted();
applyTheme(load('theme', 'system'));
measure();
updateStatus();
connect();
</script>
</body>
</html>
